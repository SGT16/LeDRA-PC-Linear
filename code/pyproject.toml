[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledra-experiments"
version = "0.1.0"
description = "Reproducible retinal adaptation experiments and source-locked scientific kernels"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "scikit-learn", "torch", "timm", "Pillow", "torchvision"]

[project.scripts]
ledra = "ledra_experiments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
